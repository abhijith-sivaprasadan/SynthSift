name: Generate study evidence preflight (review only)
on:
  push:
    branches: [review/study-level-evidence-preflight-20261020]
    paths:
      - .github/workflows/review-evidence-generate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate and audit data preparation packs
        run: |
          python scripts/prepare_review_evidence.py
          python scripts/prepare_review_evidence.py --check
          python -m pytest -q tests/test_review_preparation.py
      - name: Commit source-derived worklists on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_preparation
          if ! git diff --cached --quiet; then
            git commit -m "Publish frozen-source bibliographic verification and study-level review worklists"
            git push
          fi
