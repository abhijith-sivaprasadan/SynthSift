name: CI

on:
  schedule:
    - cron: "37 3 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip check

      - name: Compile
        run: python -m compileall -q src scripts

      - name: Unit, provenance, corpus, and sample-integrity tests
        run: pytest -q

      - name: Offline LLM screening and exact replay (no external API)
        run: |
          python scripts/run_llm_screening.py --provider fixture --out "${{ runner.temp }}/llm-fixture"
          python scripts/run_llm_screening.py --provider fixture --out "${{ runner.temp }}/llm-fixture" --resume
          python scripts/run_llm_screening.py --provider replay --model synthetic-fixture-v1 --cache "${{ runner.temp }}/llm-fixture/screening.jsonl" --out "${{ runner.temp }}/llm-replay"

      - name: Independent benchmark integrity regression (synthetic data only)
        run: python -m pytest -q tests/test_independent_benchmark.py

      - name: Rebuild deterministic screening samples
        run: python scripts/create_screening_samples.py --output-dir "${{ runner.temp }}/synthsift-samples"

      - name: Reconstruct preregistered AI-blind empirical validation pilot
        run: |
          python scripts/create_validation_pilot.py --out "${{ runner.temp }}/validation_pilot_80_v1.csv"
          python scripts/create_validation_pilot.py --out "${{ runner.temp }}/validation_pilot_80_v1.csv" --check

      - name: Build full search-derived screening queue
        run: python scripts/build_screening_queue.py

      - name: Screening-status smoke test
        run: python scripts/screening_status.py --decisions "${{ runner.temp }}/nonexistent-screening-decisions.csv"

      - name: Screening benchmark smoke test
        run: python scripts/run_screening_benchmark.py --repeats 3

      - name: Verify all 538 AI-only source-linked decisions and priority flags
        run: python scripts/audit_full_corpus_ai_screening.py --check

      - name: Verify next-stage bibliographic evidence preparation
        run: python scripts/prepare_review_evidence.py --check

      - name: Extraction benchmark smoke test
        run: python scripts/run_extraction_benchmark.py

      - name: Audit 240 AI-assisted decisions separately from human reference labels
        run: python scripts/audit_ai_screening.py --out "${{ runner.temp }}/ai_first_pass"

