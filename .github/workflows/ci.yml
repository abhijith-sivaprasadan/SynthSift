name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip check

      - name: Compile
        run: python -m compileall -q src scripts

      - name: Unit and data-integrity tests
        run: pytest -q

      - name: Screening benchmark smoke test
        run: python scripts/run_screening_benchmark.py --repeats 3

      - name: Extraction benchmark smoke test
        run: python scripts/run_extraction_benchmark.py
